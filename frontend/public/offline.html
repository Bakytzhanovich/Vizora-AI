<!doctype html>
<html lang="ru">
<head>

  <title>Vizora AI — нет подключения</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;

      background: #0A0A0F;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }

      cursor: pointer;

    <h1>Нет подключения к интернету</h1>

</html>
